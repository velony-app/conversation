syntax = "proto3";

package velony.conversation.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/velony-app/conversation/api/velony/conversation/v1;v1";
option java_multiple_files = true;
option java_outer_classname = "ConversationProto";
option java_package = "app.velony.conversation.v1";
option objc_class_prefix = "VelonyConversationV1";

// A conversation.
message Conversation {
  option (google.api.resource) = {
    type    : "conversation.velony.app/Conversation"
    pattern : "conversations/{conversation}"
    singular: "conversation"
    plural  : "conversations"
  };

  // The resource name of the conversation.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The title of the conversation.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // The avatar image of the conversation.
  string avatar_image = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
    type: "media.velony.app/Image"
    }
  ];

  // The last message in the conversation.
  string last_message = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
    type: "conversation.velony.app/Message"
    }
  ];

  // The time when the conversation was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request message for retrieving a conversation.
message GetConversationRequest {
  // The resource name of the conversation to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "conversation.velony.app/Conversation"
    }
  ];
}

// The request message for listing conversations.
message ListConversationsRequest {
  // The maximum number of conversations to return.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // A page token received from a previous list request.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The response message for listing conversations.
message ListConversationsResponse {
  // The conversations.
  repeated Conversation conversations = 1;

  // A token for retrieving the next page.
  string next_page_token = 2;
}

// The request message for creating a conversation.
message CreateConversationRequest {
  // The conversation to create.
  Conversation conversation = 1 [(google.api.field_behavior) = REQUIRED];
}

// The request message for updating a conversation.
message UpdateConversationRequest {
  // The conversation to update.
  Conversation conversation = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The request message for deleting a conversation.
message DeleteConversationRequest {
  // The resource name of the conversation to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "conversation.velony.app/Conversation"
    }
  ];
}

// The request message for replacing a conversation avatar.
message ReplaceConversationAvatarRequest {
  // The resource name of the conversation.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "conversation.velony.app/Conversation"
    }
  ];

  // The avatar image data.
  bytes data = 2 [(google.api.field_behavior) = REQUIRED];

  // The MIME type of the avatar image data.
  string mime_type = 3 [(google.api.field_behavior) = REQUIRED];
}