syntax = "proto3";

package velony.conversation.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/velony-app/conversation/api/velony/conversation/v1;v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option java_package = "app.velony.conversation.v1";
option objc_class_prefix = "VelonyConversationV1";

// A message in a conversation.
message Message {
  option (google.api.resource) = {
    type    : "conversation.velony.app/Message"
    pattern : "conversations/{conversation}/messages/{message}"
    singular: "message"
    plural  : "messages"
  };

  // The resource name of the message.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The user that sent the message.
  string user = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = { type: "user.velony.app/User" }
  ];

  // The content of the message.
  string content = 3 [(google.api.field_behavior) = REQUIRED];

  // The time when the message was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The time when the message was last updated.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request message for retrieving a message.
message GetMessageRequest {
  // The resource name of the message to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "conversation.velony.app/Message" }
  ];
}

// The request message for listing messages.
message ListMessagesRequest {
  // The conversation whose messages are being listed.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "conversation.velony.app/Conversation" }
  ];

  // The maximum number of messages to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token received from a previous ListMessages call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response message for listing messages.
message ListMessagesResponse {
  // The messages.
  repeated Message messages = 1;

  // A token for retrieving the next page.
  string next_page_token = 2;
}

// The request message for retrieving multiple messages.
message BatchGetMessagesRequest {
  // The conversation that owns the messages.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "conversation.velony.app/Conversation" }
  ];

  // The resource names of the messages to retrieve.
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "conversation.velony.app/Message" }
  ];
}

// The response message for retrieving multiple messages.
message BatchGetMessagesResponse {
  // The requested messages.
  repeated Message messages = 1;
}

// The request message for creating a message.
message CreateMessageRequest {
  // The conversation in which to create the message.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "conversation.velony.app/Conversation" }
  ];

  // The message to create.
  Message message = 2 [(google.api.field_behavior) = REQUIRED];
}

// The request message for updating a message.
message UpdateMessageRequest {
  // The message to update.
  Message message = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The request message for deleting a message.
message DeleteMessageRequest {
  // The resource name of the message to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "conversation.velony.app/Message" }
  ];
}